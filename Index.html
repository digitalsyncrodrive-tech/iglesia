<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b32">
  <title>Iglesia Bautista Peniel Ocala</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(218,190,124,.22), transparent 42%),
        linear-gradient(145deg, #102c27, #1e5142 58%, #102c27);
    }
    main {
      width: min(100%, 850px);
      padding: clamp(36px, 8vw, 76px) 24px;
      border: 1px solid rgba(238,220,174,.55);
      border-radius: 22px;
      background: rgba(8, 27, 23, .34);
      box-shadow: 0 22px 70px rgba(0,0,0,.25);
    }
    .cross {
      display: block;
      margin: 0 auto 24px;
      color: #e7d19b;
      font-family: Arial, sans-serif;
      font-size: 54px;
      line-height: 1;
    }
    h1 {
      margin: 0 auto;
      max-width: 760px;
      font-size: clamp(2.1rem, 6vw, 4.3rem);
      line-height: 1.13;
      font-weight: 600;
      letter-spacing: .015em;
    }
    .rule {
      width: 86px;
      height: 2px;
      margin: 30px auto;
      background: #e7d19b;
    }
    .notice {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid #e7d19b;
      border-radius: 999px;
      color: #f4e6c5;
      font: 700 .95rem/1.3 Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    p {
      margin: 22px 0 0;
      color: rgba(255,255,255,.83);
      font: 1.05rem/1.6 Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <span class="cross" aria-hidden="true">✝</span>
    <h1>Iglesia Bautista<br>Peniel Ocala</h1>
    <div class="rule"></div>
    <div class="notice">Estamos en construcción</div>
    <p>Muy pronto estaremos compartiendo más información.</p>
  </main>
</body>
</html>
